{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Veterinaria</title>
    <link rel="stylesheet" href="{% static 'gestion/css/estilos.css' %}">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <h2>Veterinaria</h2>
                <p>Iniciá sesión para acceder al sistema</p>
            </div>

            <form method="post" class="login-form">
                {% csrf_token %}
                
                {% if messages %}
                    {% for message in messages %}
                        <div style="background-color: #d1fae5; border: 1px solid #a7f3d0; color: #065f46; padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; text-align: center; line-height: 1.4;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                {% if form.errors %}
                    <div class="error-message">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <div class="form-group">
                    <label for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username" autocomplete="off" required autofocus>
                </div>

                <div class="form-group">
                    <label for="id_password">Contraseña</label>
                    <input type="password" name="password" id="id_password" required>
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

        </div>
    </div>

</body>
</html>
